<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("{{ url_for('static', filename='images/bg.jpg') }}") center/cover fixed;
            opacity: 0.3;
            z-index: 0;
        }
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 35px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .login-card:hover {
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .login-logo i {
            font-size: 64px;
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        .login-title {
            text-align: center;
            color: #FFD700;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .login-input-group {
            margin-bottom: 20px;
        }
        .login-input-group label {
            display: block;
            color: rgba(255, 215, 0, 0.9);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .login-input-group label i {
            margin-left: 8px;
        }
        .login-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            color: #FFD700;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .login-input:focus {
            outline: none;
            border-color: #FFD700;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }
        .login-input::placeholder {
            color: rgba(255, 215, 0, 0.4);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.9), rgba(255, 179, 0, 0.9));
            border: none;
            border-radius: 14px;
            color: #1a1a2e;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }
        .login-alert {
            margin-bottom: 20px;
            padding: 12px;
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            border-radius: 12px;
            color: #f87171;
            text-align: center;
            font-size: 13px;
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card {
            animation: fadeInUp 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-store"></i>
            </div>
            <h2 class="login-title">ورود به سیستم</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="login-alert">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="login-input-group">
                    <label><i class="fas fa-user"></i> نام کاربری</label>
                    <input type="text" name="username" class="login-input" placeholder="نام کاربری خود را وارد کنید" required autofocus>
                </div>
                <div class="login-input-group">
                    <label><i class="fas fa-lock"></i> رمز عبور</label>
                    <input type="password" name="password" class="login-input" placeholder="رمز عبور خود را وارد کنید" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> ورود
                </button>
            </form>
            <div class="login-footer">
                <i class="fas fa-shield-alt"></i> سیستم مدیریت فروشگاه
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
